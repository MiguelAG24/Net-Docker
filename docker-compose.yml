
services:
  api:
    build:
      context: ./ApiEmpresa
      dockerfile: Dockerfile
    image: api-clientes:latest
    container_name: api-clientes-compose
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionAzureSQL: ${AZURE_SQL_CONNECTION:?Falta configurar AZURE_SQL_CONNECTION}
    restart: unless-stopped

  blazor:
    build:
      context: ./BlazorEmpresa
      dockerfile: Dockerfile
    image: blazor-clientes:latest
    container_name: blazor-clientes-compose
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: http://api:8080/
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      - api
    restart: unless-stopped
